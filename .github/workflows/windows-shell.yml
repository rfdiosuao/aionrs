name: Windows command execution

on:
  pull_request:
    branches: [fix/context-request-budget]

permissions:
  contents: read

env:
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  AION_TEST_REQUIRE_PWSH: "1"

jobs:
  windows-shell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
      - name: Verify Windows PowerShell and PowerShell 7 are available
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required' }
          powershell.exe -NoProfile -Command 'if ($PSVersionTable.PSEdition -ne "Desktop") { exit 1 }'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell is required' }
      - name: Exercise Windows shell resolution and real commands
        run: cargo test --locked -p aion-config -p aion-tools -p aion-agent --lib windows_
